<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar Antrian — WashQueue</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --accent: #00d4aa;
      --accent2: #0099ff;
      --text: #e6edf3;
      --muted: #7d8590;
      --border: #30363d;
      --error: #f85149;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--accent);
    }
    .logo span { color: var(--text); }
    .nav-links { display: flex; gap: 1rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .nav-links a:hover { background: var(--surface2); color: var(--text); }
    .nav-links a.active { background: var(--accent); color: #000; font-weight: 500; }

    .page-wrap {
      max-width: 560px;
      margin: 3rem auto;
      padding: 0 1.5rem 4rem;
    }
    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }
    .page-header p { color: var(--muted); font-size: 0.92rem; }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }

    .form-group { margin-bottom: 1.4rem; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,170,0.15);
    }
    .form-group input::placeholder { color: var(--muted); }

    /* Kendaraan pilihan visual */
    .vehicle-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .vehicle-option input[type="radio"] { display: none; }
    .vehicle-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.2rem;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .vehicle-option label .icon { font-size: 2rem; }
    .vehicle-option input[type="radio"]:checked + label {
      border-color: var(--accent);
      background: rgba(0,212,170,0.08);
      color: var(--accent);
    }
    .vehicle-option label:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    .info-note {
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
      background: rgba(0,153,255,0.08);
      border: 1px solid rgba(0,153,255,0.2);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #58a6ff;
    }
    .info-note .icon { flex-shrink: 0; margin-top: 0.05rem; }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: #00bfa0;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,212,170,0.3);
    }
    .btn-back {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.2s;
    }
    .btn-back:hover { color: var(--text); }
  </style>
</head>
<body>

<nav>
  <div class="logo">Wash<span>Queue</span></div>
  <div class="nav-links">
    <a href="/">Antrian</a>
    <a href="/daftar" class="active">Daftar</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Daftar Antrian</h1>
    <p>Isi data kendaraan Anda untuk mendapatkan nomor antrian.</p>
  </div>

  <div class="form-card">
    <form method="POST" action="/daftar">

      <div class="form-group">
        <label>Jenis Kendaraan</label>
        <div class="vehicle-options">
          <div class="vehicle-option">
            <input type="radio" name="jenis" id="motor" value="Motor" required>
            <label for="motor">
              <span class="icon">🏍️</span>
              Motor
            </label>
          </div>
          <div class="vehicle-option">
            <input type="radio" name="jenis" id="mobil" value="Mobil">
            <label for="mobil">
              <span class="icon">🚗</span>
              Mobil
            </label>
          </div>
        </div>
      </div>

      <hr class="divider"/>

      <div class="form-group">
        <label for="nama">Nama Pemilik</label>
        <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required/>
      </div>

      <div class="form-group">
        <label for="no_hp">Nomor HP</label>
        <input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 08123456789" required/>
      </div>

      <div class="form-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" placeholder="Contoh: budi@email.com" required/>
      </div>

      <div class="info-note">
        <span class="icon">ℹ️</span>
        <span>Notifikasi akan dikirim ke email Anda saat giliran tiba. Pastikan email aktif dan bisa diterima.</span>
      </div>

      <button type="submit" class="btn-submit">Ambil Nomor Antrian →</button>
    </form>
    <a href="/" class="btn-back">← Kembali ke halaman antrian</a>
  </div>
</div>

</body>
</html>
